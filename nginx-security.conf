# ============================================================================
# Nginx Security Hardening — Ronsberger HMO Portal
# Apply to the Coolify Nginx container serving app.ronsbergerhmo.io
# ============================================================================
#
# HOW TO APPLY ON THE VPS:
#   1. Find the nginx container name:
#        docker ps | grep nginx
#
#   2. Copy this file into the container:
#        docker cp /root/nginx-security.conf <container_name>:/etc/nginx/conf.d/security.conf
#
#   3. Test config:
#        docker exec <container_name> nginx -t
#
#   4. Reload (zero downtime):
#        docker exec <container_name> nginx -s reload
#
# ============================================================================

# ── Rate limiting zones (place in http{} block / conf.d) ───────────────────
# Limit each IP to 30 requests/minute to the API proxy
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/m;
# Stricter zone for auth endpoints (login, password reset)
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;

server {
    listen 80;
    listen 443 ssl;
    server_name app.ronsbergerhmo.io;

    # ── HSTS (tell browsers: HTTPS only for 2 years, include subdomains) ───
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Block clickjacking (no iframes from other origins) ─────────────────
    add_header X-Frame-Options "DENY" always;

    # ── Stop MIME sniffing (browser must respect declared Content-Type) ─────
    add_header X-Content-Type-Options "nosniff" always;

    # ── Referrer: only send origin, never full URL to external sites ────────
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Disable unused browser features ────────────────────────────────────
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()" always;

    # ── Content Security Policy ─────────────────────────────────────────────
    # Restricts what scripts/resources the browser can load.
    # - default-src 'self': only load from our own domain by default
    # - script-src 'self' 'unsafe-inline': React needs inline scripts (SPA)
    # - connect-src: allow calls to our own API and Supabase realtime (wss)
    # - img-src: allow data URIs (avatars/charts) and blob (PDF preview)
    # - font-src: local fonts + data URIs
    # - frame-ancestors 'none': no iframes (same as X-Frame-Options DENY)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.ronsbergerhmo.io wss://api.ronsbergerhmo.io; img-src 'self' data: blob:; font-src 'self' data:; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    # ── Hide server fingerprint ─────────────────────────────────────────────
    server_tokens off;
    more_clear_headers Server;
    more_clear_headers X-Powered-By;

    # ── Apply rate limit to all requests ───────────────────────────────────
    limit_req zone=api_zone burst=20 nodelay;
    limit_req_status 429;

    # ── Stricter rate limit on auth paths ──────────────────────────────────
    location ~ ^/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://localhost:3000;  # adjust to your upstream
    }

    # ── Block common attack paths ──────────────────────────────────────────
    location ~* \.(git|env|sql|bak|sh|log)$ {
        deny all;
        return 404;
    }
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Cache static assets (JS/CSS bundles) ──────────────────────────────
    location ~* \.(js|css|woff2|woff|ttf|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-add security headers (nginx clears them in nested locations)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # ── SPA fallback: all unknown routes → index.html ─────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
