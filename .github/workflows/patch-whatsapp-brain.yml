name: Apply WhatsApp Brain Patch

on:
  push:
    branches: [feat/whatsapp-ai-brain-spec]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/whatsapp-ai-brain-spec
          fetch-depth: 0

      - name: Patch WhatsApp worker
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('uicodereqeust-main/supabase/functions/whatsapp-worker/index.ts')
          s = p.read_text()

          if 'function deterministicIntentGuard(' in s:
              print('Brain patch already present')
              raise SystemExit(0)

          s = s.replace(
              'async function extractWithGemini(text: string): Promise<GeminiAnalysisResult> {',
              'async function extractWithGemini(text: string, conversationContext = ""): Promise<GeminiAnalysisResult> {',
              1,
          )
          s = s.replace(
              'contents: [{ role: "user", parts: [{ text }] }],',
              'contents: [{ role: "user", parts: [{ text: conversationContext ? `${conversationContext}\\n\\nCURRENT MESSAGE:\\n${text}` : text }] }],',
              1,
          )

          marker = '// ── Main Processing for one message_id'
          insert = r'''// ── AI Brain Context + Deterministic Intent Guardrails ───────────────────────
          function extractQueryPatientName(text: string): string | null {
            const patterns = [
              /\b(?:status|update|approval|approved|rejected|rejection|details?)\s+(?:for|of)\s+([A-Za-z][A-Za-z .'-]{1,80}?)(?:\?|$|\.|\s+(?:please|now|yet|today)\b)/i,
              /\b(?:has|is)\s+([A-Za-z][A-Za-z .'-]{1,80}?)\s+(?:been\s+)?(?:approved|rejected|processed)\b/i,
            ];
            for (const pattern of patterns) {
              const m = text.match(pattern);
              if (m?.[1]) return m[1].trim().replace(/[.,!?]+$/, "");
            }
            return null;
          }

          function deterministicIntentGuard(text: string, analysis: GeminiAnalysisResult, conversation: any): GeminiAnalysisResult {
            const t = text.trim();
            const out = { ...analysis };
            const statusSignal = (/\b(status|update|approval|approved|rejected|rejection|declined|pending|decision|progress)\b/i.test(t) &&
              /\b(request|authorization|case|patient|him|her|it|this)\b/i.test(t)) ||
              /\b(?:status|update|approval|approved|rejected|rejection|declined|pending)\s+(?:for|of)\b/i.test(t);
            const statusQuestion = /\b(?:what|where|any|has|is|can|please|need|want|check|tell)\b.*\b(?:status|update|approved|approval|rejected|rejection|pending|decision)\b/i.test(t) ||
              /\b(?:status|update|approval|approved|rejected|rejection|pending)\b.*\?/i.test(t);
            const explicitStatus = statusSignal || statusQuestion;
            const providerSignal = /\b(?:health\s+provider|healthcare\s+provider|provider|hospital|clinic|doctor|specialist|facility)\b/i.test(t) &&
              /\b(?:need|want|looking|find|ask|recommend|which|where|nearest|available|help)\b/i.test(t);
            const authSignal = hasStrongAuthIndicators(t) ||
              /\b(?:submit|request|authorization|pre[- ]?authorization)\b/i.test(t) &&
              /\b(?:patient|diagnosis|treatment|drug|procedure|investigation|service|nhia|nhis|policy)\b/i.test(t);

            if (explicitStatus && !authSignal) {
              out.intent = /\b(?:rejected|rejection|declined|why\s+was)\b/i.test(t) ? "REJECTION_QUERY" :
                /\b(?:approved|approval|authorize[d]?)\b/i.test(t) ? "APPROVAL_QUERY" : "AUTHORIZATION_STATUS";
              out.queryPatientName = extractQueryPatientName(t) || out.queryPatientName || out.patientName || conversation?.last_patient_name || null;
              out.queryPolicyNumber = out.queryPolicyNumber || out.policyNumber || conversation?.last_policy_number || null;
              out.missingInfo = [];
              return out;
            }
            if (providerSignal && !authSignal && !explicitStatus) {
              out.intent = "PROVIDER_QUERY";
              out.missingInfo = [];
              return out;
            }
            if (authSignal && !explicitStatus) {
              out.intent = hasStrongAuthIndicators(t) ? "NEW_AUTHORIZATION" : (out.intent || "INCOMPLETE_AUTHORIZATION");
              const raw = extractAuthFieldsFromRaw(t);
              out.patientName = out.patientName || raw.patientName;
              out.policyNumber = out.policyNumber || raw.policyNumber;
              out.diagnosis = out.diagnosis || raw.diagnosis;
              out.treatment = out.treatment || raw.treatment;
              out.procedure = out.procedure || raw.procedure;
              out.investigation = out.investigation || raw.investigation;
              out.requestedService = out.requestedService || raw.requestedService;
              out.originatingHospital = out.originatingHospital || raw.originatingHospital;
            }
            if (["UNKNOWN", "NO_AUTHORIZATION", "GENERAL_CONVERSATION"].includes(out.intent) && conversation?.active_intent === "INCOMPLETE_AUTHORIZATION" &&
              /\b(?:name|patient|nhia|nhis|policy|diagnosis|treatment|drug|procedure|investigation|service)\b/i.test(t)) {
              out.intent = "CONTINUE_AUTHORIZATION";
            }
            return out;
          }

          function buildConversationContext(conversation: any, recentMessages: any[]): string {
            const pending = conversation?.pending_data && typeof conversation.pending_data === "object" ? JSON.stringify(conversation.pending_data) : "{}";
            const history = (recentMessages || []).slice(-8).map((m: any) => `${m.direction || "inbound"}: ${String(m.message_body || "").slice(0, 1200)}`).join("\n");
            return [
              "CONVERSATION CONTEXT (current message has priority):",
              `active_intent=${conversation?.active_intent || "none"}`,
              `last_patient_name=${conversation?.last_patient_name || "none"}`,
              `last_policy_number=${conversation?.last_policy_number || "none"}`,
              `pending_data=${pending}`,
              "RECENT MESSAGES:",
              history || "none",
            ].join("\n");
          }

          '''
          if marker not in s:
              raise SystemExit('worker marker not found')
          s = s.replace(marker, insert + marker, 1)

          old = '''  const pendingData: Record<string, string> = (conversation?.pending_data && typeof conversation.pending_data === "object")
    ? conversation.pending_data
    : {};

  let lastCreatedAuthId: string | null = null;'''
          new = '''  const pendingData: Record<string, string> = (conversation?.pending_data && typeof conversation.pending_data === "object")
    ? conversation.pending_data
    : {};

  const { data: recentMessages } = await supabase
    .from("whatsapp_messages")
    .select("message_body, received_at, message_type")
    .eq("phone_number", row.phone_number)
    .order("received_at", { ascending: false })
    .limit(8);
  const conversationContext = buildConversationContext(conversation, (recentMessages || []).reverse());

  let lastCreatedAuthId: string | null = null;'''
          if old not in s:
              raise SystemExit('pending state marker not found')
          s = s.replace(old, new, 1)

          old = 'analysis = await extractWithGemini(blockText);'
          new = 'analysis = deterministicIntentGuard(blockText, await extractWithGemini(blockText, conversationContext), conversation);'
          if old not in s:
              raise SystemExit('Gemini call not found')
          s = s.replace(old, new, 1)

          old = '''    let intent = (analysis.intent || "UNKNOWN").toUpperCase();
    const preOverrideIntent = intent;'''
          new = '''    let intent = (analysis.intent || "UNKNOWN").toUpperCase();
    const preOverrideIntent = intent;
    await updateConversationState(supabase, row.phone_number, { active_intent: intent });'''
          if old not in s:
              raise SystemExit('intent marker not found')
          s = s.replace(old, new, 1)

          old = 'if (["GREETING", "GENERAL_CONVERSATION", "HELP", "NO_AUTHORIZATION", "UNKNOWN", "NON_TEXT_MESSAGE"].includes(intent)) {'
          new = 'if (["GREETING", "GENERAL_CONVERSATION", "HELP", "NO_AUTHORIZATION", "UNKNOWN", "NON_TEXT_MESSAGE", "PROVIDER_QUERY"].includes(intent)) {'
          if old not in s:
              raise SystemExit('non-auth routing marker not found')
          s = s.replace(old, new, 1)

          needle = '      } else if (intent === "GENERAL_CONVERSATION" && analysis.conversationalReply && analysis.conversationalReply.trim()) {'
          replacement = '''      } else if (intent === "PROVIDER_QUERY") {
        replyText = "Sure. I can help with provider information. Please tell me what you need the provider for (for example, hospital/clinic, specialist, consultation, laboratory test, or another service) and your preferred location.\\n\\n— Ronsberger HMO";
      } else if (intent === "GENERAL_CONVERSATION" && analysis.conversationalReply && analysis.conversationalReply.trim()) {'''
          if needle not in s:
              raise SystemExit('provider insertion marker not found')
          s = s.replace(needle, replacement, 1)

          p.write_text(s)

      - name: Verify TypeScript shape
        run: |
          grep -n "extractWithGemini(text: string, conversationContext\|deterministicIntentGuard\|buildConversationContext\|PROVIDER_QUERY" uicodereqeust-main/supabase/functions/whatsapp-worker/index.ts

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uicodereqeust-main/supabase/functions/whatsapp-worker/index.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: add WhatsApp conversation brain routing and context"
            git push origin HEAD:feat/whatsapp-ai-brain-spec
          fi
